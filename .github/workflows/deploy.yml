name: CD Pipeline

on:
  push:
    tags:
      - 'v*.*.*'
  release:
    types: [published]
  workflow_dispatch:

env:
  SSH_HOST: 'course.prafdin.ru'
  SSH_PORT: '2457'
  SSH_USERNAME: 'uwu'
  APP_DIR: '/home/uwu/devops'
  ID: 'barsukov'
  PROXY: 'course.prafdin.ru'
  DOCKER_IMAGE_NAME: 'app-barsukov'
  DOCKER_REGISTRY: 'ghcr.io'

jobs:
  deploy:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      with:
        submodules: recursive
        
    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3
      
    - name: Log in to Container Registry
      uses: docker/login-action@v3
      with:
        registry: ${{ env.DOCKER_REGISTRY }}
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    
    - name: Build and push Docker image
      uses: docker/build-push-action@v5
      with:
        context: .
        file: ./Dockerfile
        push: true
        tags: |
          ${{ env.DOCKER_REGISTRY }}/${{ github.repository_owner }}/${{ env.DOCKER_IMAGE_NAME }}:latest
          ${{ env.DOCKER_REGISTRY }}/${{ github.repository_owner }}/${{ env.DOCKER_IMAGE_NAME }}:${{ github.ref_name }}
        # БЕЗ КЭШИРОВАНИЯ для простоты
    
    - name: Deploy to VM
      uses: appleboy/ssh-action@v1
      with:
        host: ${{ env.SSH_HOST }}
        port: ${{ env.SSH_PORT }}
        username: ${{ env.SSH_USERNAME }}
        key: ${{ secrets.SSH_PRIVATE_KEY }}
        script: |
          set -e
          echo "=== Starting deployment ==="
          
          # Login to container registry
          echo "${{ secrets.GITHUB_TOKEN }}" | docker login ${{ env.DOCKER_REGISTRY }} -u ${{ github.actor }} --password-stdin
          
          echo "=== Pulling latest Docker image ==="
          docker pull ${{ env.DOCKER_REGISTRY }}/${{ github.repository_owner }}/${{ env.DOCKER_IMAGE_NAME }}:latest
          
          echo "=== Stopping existing container ==="
          docker stop ${{ env.DOCKER_IMAGE_NAME }} 2>/dev/null || echo "Container not running"
          docker rm ${{ env.DOCKER_IMAGE_NAME }} 2>/dev/null || echo "Container does not exist"
          
          echo "=== Starting new container ==="
          docker run -d \
            --name ${{ env.DOCKER_IMAGE_NAME }} \
            --restart unless-stopped \
            -p 8080:80 \
            ${{ env.DOCKER_REGISTRY }}/${{ github.repository_owner }}/${{ env.DOCKER_IMAGE_NAME }}:latest
          
          echo "=== Cleaning up ==="
          docker image prune -f
          
          echo "=== Deployment completed ==="
          docker ps --filter "name=${{ env.DOCKER_IMAGE_NAME }}"
