name: CD Pipeline

on:
  release:
    types: [published]
  workflow_dispatch:

env:
  SSH_HOST: 'course.prafdin.ru'
  SSH_PORT: '2457'
  SSH_USERNAME: 'uwu'
  APP_DIR: '/home/uwu/devops'
  ID: 'barsukov'
  PROXY: 'course.prafdin.ru'
  DOCKER_IMAGE_NAME: 'app-barsukov'
  DOCKER_REGISTRY: 'ghcr.io'

jobs:
  deploy:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code with submodules
      uses: actions/checkout@v4
      with:
        submodules: recursive
        
    - name: Run tests
      run: |
        cd devops
        if [ -f "test.sh" ]; then
          chmod +x test.sh
          ./test.sh
        fi
        
    - name: Build application
      run: |
        if [ ! -d "static-website-example" ]; then
          exit 1
        fi
    
    - name: Log in to Container Registry
      uses: docker/login-action@v3
      with:
        registry: ${{ env.DOCKER_REGISTRY }}
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    
    - name: Build and push Docker image
      uses: docker/build-push-action@v5
      with:
        context: .
        file: ./Dockerfile
        push: true
        tags: |
          ${{ env.DOCKER_REGISTRY }}/${{ github.repository }}/${{ env.DOCKER_IMAGE_NAME }}:latest
          ${{ env.DOCKER_REGISTRY }}/${{ github.repository }}/${{ env.DOCKER_IMAGE_NAME }}:${{ github.sha }}
        cache-from: type=gha
        cache-to: type=gha,mode=max
    
    - name: Deploy to VM
      uses: appleboy/ssh-action@v1
      with:
        host: ${{ env.SSH_HOST }}
        port: ${{ env.SSH_PORT }}
        username: ${{ env.SSH_USERNAME }}
        key: ${{ secrets.SSH_PRIVATE_KEY }}
        script: |
          cd ${{ env.APP_DIR }}
          git pull origin main
          git submodule update --init --recursive
          
          # Login to container registry
          echo "${{ secrets.GITHUB_TOKEN }}" | docker login ${{ env.DOCKER_REGISTRY }} -u ${{ github.actor }} --password-stdin
          
          # Pull latest Docker image
          docker pull ${{ env.DOCKER_REGISTRY }}/${{ github.repository }}/${{ env.DOCKER_IMAGE_NAME }}:latest
          
          # Stop and remove existing container if running
          docker stop ${{ env.DOCKER_IMAGE_NAME }} || true
          docker rm ${{ env.DOCKER_IMAGE_NAME }} || true
          
          # Run new container with proper configuration
          docker run -d \
            --name ${{ env.DOCKER_IMAGE_NAME }} \
            --restart unless-stopped \
            -p 8080:80 \
            ${{ env.DOCKER_REGISTRY }}/${{ github.repository }}/${{ env.DOCKER_IMAGE_NAME }}:latest
          
          # Clean up old images
          docker image prune -f
