name: CD Pipeline

on:
  push:
    tags:
      - 'v*.*.*'
  release:
    types: [published]
  workflow_dispatch:

env:
  SSH_HOST: 'course.prafdin.ru'
  SSH_PORT: '2457'
  SSH_USERNAME: 'uwu'
  APP_DIR: '/home/uwu/devops'
  ID: 'barsukov'
  PROXY: 'course.prafdin.ru'
  DOCKER_IMAGE_NAME: 'app-barsukov'

jobs:
  deploy:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      with:
        submodules: recursive
        
    - name: Verify application structure
      run: |
        echo "Checking application structure..."
        [ -d "static-website-example" ] && echo "✅ static-website-example directory found" || echo "⚠️ static-website-example directory not found"
        [ -f "Dockerfile" ] && echo "✅ Dockerfile found" || echo "❌ Dockerfile not found"
        ls -la
        
    - name: Log in to Docker Hub
      uses: docker/login-action@v3
      with:
        username: ${{ secrets.DOCKERHUB_USERNAME }}
        password: ${{ secrets.DOCKERHUB_TOKEN }}
    
    - name: Build and push Docker image
      uses: docker/build-push-action@v5
      with:
        context: .
        push: true
        tags: |
          ${{ secrets.DOCKERHUB_USERNAME }}/${{ env.DOCKER_IMAGE_NAME }}:latest
          ${{ secrets.DOCKERHUB_USERNAME }}/${{ env.DOCKER_IMAGE_NAME }}:${{ github.ref_name }}
    
    - name: Deploy to VM
      uses: appleboy/ssh-action@v1
      with:
        host: ${{ env.SSH_HOST }}
        port: ${{ env.SSH_PORT }}
        username: ${{ env.SSH_USERNAME }}
        key: ${{ secrets.SSH_PRIVATE_KEY }}
        script: |
          set -e  # Exit on any error
          
          echo "=== Starting deployment ==="
          
          # Login to Docker Hub
          echo "${{ secrets.DOCKERHUB_TOKEN }}" | docker login -u ${{ secrets.DOCKERHUB_USERNAME }} --password-stdin
          
          echo "=== Pulling latest Docker image ==="
          # Pull latest Docker image
          docker pull ${{ secrets.DOCKERHUB_USERNAME }}/${{ env.DOCKER_IMAGE_NAME }}:latest
          
          echo "=== Stopping existing container ==="
          # Stop and remove existing container if running
          docker stop ${{ env.DOCKER_IMAGE_NAME }} 2>/dev/null || echo "Container not running"
          docker rm ${{ env.DOCKER_IMAGE_NAME }} 2>/dev/null || echo "Container does not exist"
          
          echo "=== Starting new container ==="
          # Run new container with proper configuration
          docker run -d \
            --name ${{ env.DOCKER_IMAGE_NAME }} \
            --restart unless-stopped \
            -p 8080:80 \
            ${{ secrets.DOCKERHUB_USERNAME }}/${{ env.DOCKER_IMAGE_NAME }}:latest
          
          echo "=== Cleaning up old images ==="
          # Clean up old images
          docker image prune -f
          
          echo "=== Deployment completed successfully ==="
          echo "Container status:"
          docker ps --filter "name=${{ env.DOCKER_IMAGE_NAME }}"
